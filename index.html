<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>你的恋爱隐藏短板</title><style>:root{--ink:#34443f;--sage:#778f82;--blue:#8597a3;--paper:#f3f0e9;--line:#d7d9d0}*{box-sizing:border-box}body{margin:0;background:linear-gradient(140deg,#dce5df,#e5e8e9 52%,#eee9df);color:var(--ink);font-family:"Microsoft YaHei",sans-serif;min-height:100vh}main{max-width:680px;margin:auto;padding:32px 18px 70px}.card{background:rgba(250,249,244,.94);border:1px solid #fff;border-radius:28px;box-shadow:0 20px 60px #52675b24;padding:clamp(26px,6vw,48px);animation:in .4s ease}@keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}.eyebrow{color:var(--sage);letter-spacing:.24em;font-size:12px}.hero h1{font-family:serif;font-size:clamp(38px,8vw,64px);line-height:1.15;margin:24px 0}.subtitle{line-height:1.9;color:#68746c}.stamp{border:1px solid var(--sage);border-radius:100%;width:74px;height:74px;display:grid;place-items:center;transform:rotate(-13deg);color:var(--sage);margin:35px 0}button{font:inherit;cursor:pointer}.primary{border:0;background:var(--sage);color:white;border-radius:100px;padding:15px 32px;margin-top:28px}.primary:hover{background:#60796c}.top{display:flex;justify-content:space-between;color:var(--sage);font-size:13px}.bar{height:6px;background:#e2e7e1;border-radius:8px;margin:15px 0 38px;overflow:hidden}.fill{height:100%;background:var(--sage);transition:width .35s}h2{font-family:serif;font-size:clamp(24px,5vw,32px);line-height:1.4;font-weight:500;margin-bottom:30px}.option{display:block;width:100%;text-align:left;background:#f7f7f2;border:1px solid var(--line);border-radius:15px;padding:17px 19px;margin:12px 0;color:var(--ink);line-height:1.6}.option:hover,.option:focus{background:#e7eee8;border-color:var(--sage)}.back{border:0;background:none;color:var(--sage);margin-top:25px}.result{max-width:560px;margin:auto}.result h1{font-family:serif;font-size:45px;margin:16px 0}.quote{font-size:21px;line-height:1.6;color:#617b70}.section{border-top:1px solid var(--line);padding-top:19px;margin-top:26px}.section h3{font-size:14px;letter-spacing:.15em;color:var(--sage)}.section p,.section li{line-height:1.85;color:#526159}.theater{background:#e9eeea;border-radius:18px;padding:18px;white-space:pre-line;line-height:1.9}.small{font-size:12px;color:#8a948d;line-height:1.7}.actions{display:flex;gap:12px;flex-wrap:wrap}.secondary{border:1px solid var(--sage);background:none;color:var(--sage);border-radius:100px;padding:13px 22px;margin-top:28px}@media(max-width:500px){main{padding:18px 12px 40px}.card{border-radius:22px}}</style></head><body><main id="app"></main><script>
const types={silent:{name:'沉默型',quote:'你的懂事，有时候挡住了你的需要。',show:'被误解时先把话收回去，等情绪平静才想起真正想说的。',why:'你习惯先整理好自己，才愿意给关系添一点波澜。',gift:'你善于倾听，也愿意给对方思考的空间。',tips:['先说一句“我还没想清楚，但这件事对我重要”。','约一个具体时间，把没说完的话补上。','用“我感到……”代替猜测对方的意图。'],scene:'你：其实刚才那句话让我有点难过。\n对方：我不知道，你愿意再说说吗？\n旁白：沉默终于有了字幕。'},giving:{name:'全给型',quote:'把爱留一份给自己，关系才有呼吸。',show:'常常主动照顾对方，自己的时间和界限却悄悄缩小。',why:'你把付出当成靠近的方式，也希望对方被照顾得安心。',gift:'你温暖细致，能发现别人没说出口的需要。',tips:['答应前先问自己是否真的有余力。','每周保留一段只属于自己的时间。','直接说出你希望得到的回应。'],scene:'你：今天我想先休息，明天再帮你。\n对方：当然可以。\n旁白：爱没有因为一句“不方便”而变少。'},ideal:{name:'理想型',quote:'期待可以很美，也值得被说清。',show:'心里有一幅理想关系的画，现实稍有偏差就容易失落。',why:'你认真看待亲密关系，希望相处能回应心中的珍惜。',gift:'你重视仪式感，愿意为关系创造美好。',tips:['把“你应该懂”换成一个具体请求。','区分必要需求和锦上添花的期待。','留意对方已经在做的、不同形式的关心。'],scene:'你：纪念日我想一起吃顿饭。\n对方：好，我们提前订位。\n旁白：读心术下线，心意终于上线。'},ruminate:{name:'内耗型',quote:'别让每一次沉默，都变成你的独角戏。',show:'一句话、一个表情会在脑中反复回放，容易把不确定当作坏消息。',why:'你很在意关系的变化，也敏感地捕捉细节。',gift:'你有细腻的共情力，能察觉相处中的微小变化。',tips:['把事实和自己的猜测分开写下。','先做一件让身体放松的小事，再谈问题。','用一个直接的问题确认，而不是反复推演。'],scene:'你：你刚才安静，是不是不开心？\n对方：只是有点累。\n旁白：悬疑片播到一半，原来是生活片。'},solo:{name:'独行者型',quote:'让人靠近，不会削弱你的力量。',show:'遇到难事习惯自己扛，想念陪伴时也不太愿意开口。',why:'独立曾让你很安心，所以求助看起来像一件大事。',gift:'你可靠、自持，也尊重彼此的空间。',tips:['从一件小事开始请对方帮忙。','说清楚“我想要陪伴，不需要解决方案”。','给亲密留出固定的相处时间。'],scene:'你：今晚可以陪我散步吗？\n对方：可以。\n旁白：并肩走，也是一种独立。'},rush:{name:'加速型',quote:'确认心意，也允许关系慢慢长大。',show:'关系刚有进展，就想尽快知道答案和未来。',why:'清晰的承诺会让你安心，等待则容易带来不确定。',gift:'你坦诚主动，愿意认真推进关系。',tips:['把“现在必须有答案”改成约定下一次沟通时间。','观察持续的行动，不只看一次表态。','在等待时继续自己的生活节奏。'],scene:'你：我喜欢我们现在的相处，月底再聊下一步好吗？\n对方：好。\n旁白：进度条不必一次拉满。'},yielding:{name:'退让型',quote:'你的温柔，也值得拥有自己的位置。',show:'冲突时先说“都可以”，过后才发现自己并不舒服。',why:'你珍惜和气，担心表达不同会让关系受伤。',gift:'你擅长协调，也愿意理解另一种立场。',tips:['先给出自己的真实偏好，再商量折中。','练习说“我需要想一想”，给自己一点时间。','小分歧也可以温和地表达，不必等到积累成委屈。'],scene:'你：这次我更想去安静的地方。\n对方：那我们换一家。\n旁白：不同意见，也能坐在同一张桌前。'}};
const keys=Object.keys(types);const Q=[
['被误解时，你通常会？',['先安静，过后再解释','立刻反省是不是自己哪里没做好','反复琢磨对方那句话']],['对方临时需要你帮忙，你已经很累了。',['还是答应，怕对方失望','说自己可以处理，不想麻烦别人','先问清时间再决定']],['纪念日的安排和想象中不同。',['心里失落，却觉得说出来没意思','直接说出自己期待的环节','担心这意味着对方没那么在意']],['争吵刚结束，你更想？',['先独自消化，不再提','赶紧确认我们还好吗','先道歉让气氛缓和']],['对方说“以后会多陪你”，你会？',['希望有一个具体计划','先相信，但默默期待兑现','觉得不能太依赖这个承诺']],['想念对方但对方很忙。',['把想念藏起来','发消息问什么时候能见','安排自己的事，晚些再联系']],['一起做决定时意见不一致。',['顺着对方，避免争执','清楚表达偏好再商量','怕说重了，来回斟酌']],['你付出很多，对方没注意到。',['继续做，等对方自己发现','觉得有点委屈，期待被看见','直接告诉对方这件事对自己重要']],['收到一句简短的“嗯”。',['猜是不是自己说错话','没太在意，继续做自己的事','马上问对方是不是生气']],['需要一点独处时间时。',['担心对方误会，勉强陪伴','直接说明想休息多久','干脆不解释，自己消失一会儿']],['对方提起未来，你会？',['想尽快定下具体方向','愿意慢慢聊，边走边看','担心期待越多落差越大']],['朋友评价你们的关系，你会？',['反复想那句话是否有道理','听听就好，还是看自己的感受','先替对方解释']],['对方忘了你说过的小愿望。',['觉得有些难过，原以为对方会记得','提醒对方并重新约定','觉得自己不该提要求']],['你生病时最可能？',['自己解决，康复后才告诉对方','希望对方主动发现并照顾','直接说需要什么帮助']],['对方想看你的私人聊天记录。',['觉得不舒服，但还是给看','温和说明隐私边界','担心拒绝会影响信任']],['一次约会被取消后。',['先说没关系，自己消化失落','询问原因并一起改期','想确认是不是关系出了问题']],['对方表达爱意的方式与你不同。',['期待对方能用你喜欢的方式','告诉对方自己喜欢什么','怕提要求显得不知足']],['你有烦恼时。',['先一个人处理好','想说又怕给对方压力','直接问对方现在能否听你聊聊']],['争吵后对方暂时不回复。',['脑内复盘每一句话','希望立刻得到一句“没事了”','同意晚些再谈，并去做别的事']],['共同计划总由你来安排。',['继续安排，觉得这样更省心','希望对方主动分担，却没开口','提出这次轮流负责']],['对方提出你不喜欢的玩笑。',['笑着带过','说出自己不喜欢这个玩笑','回家后反复回想']],['关系进展顺利时。',['想尽快确定下一阶段','享受当下，继续了解','担心好状态会突然消失']],['面对对方的请求，你最常说？',['“好，我来吧”','“我想想是否有空”','“随你决定”']],['你发现自己最近很少见朋友。',['觉得恋爱就该优先','主动安排朋友和独处时间','担心提出来对方会不高兴']],['如果给这段关系加一句提醒。',['“有话早点说”','“别把所有期待放在对方身上”','“我也可以有自己的选择”']]];
const weights=[['silent','yielding','ruminate'],['giving','solo','yielding'],['ideal','ideal','ruminate'],['silent','rush','yielding'],['rush','ideal','solo'],['silent','rush','solo'],['yielding','ideal','ruminate'],['giving','ideal','silent'],['ruminate','solo','rush'],['yielding','silent','solo'],['rush','ideal','ruminate'],['ruminate','solo','giving'],['ideal','silent','yielding'],['solo','ideal','giving'],['yielding','giving','ruminate'],['yielding','ideal','rush'],['ideal','silent','yielding'],['solo','silent','giving'],['ruminate','rush','solo'],['giving','ideal','yielding'],['yielding','silent','ruminate'],['rush','ideal','ruminate'],['giving','solo','yielding'],['giving','solo','yielding'],['silent','ideal','yielding']];
let answers=[],step=-1;const app=document.getElementById('app');function render(){if(step<0){app.innerHTML=`<div class="card hero"><div class="eyebrow">一份温柔的关系观察</div><div class="stamp">恋爱<br>小笺</div><h1>你的恋爱<br>隐藏短板</h1><p class="subtitle">25 个生活里的小选择，看看你在亲密关系中，哪一种习惯最容易悄悄遮住自己的需要。</p><p class="small">约 5 分钟 · 趣味自省测试 · 不作心理诊断，也没有标准答案</p><button class="primary" onclick="step=0;render()">开始探索 →</button></div>`;return}if(step<25){let q=Q[step];app.innerHTML=`<div class="card"><div class="top"><span>恋爱观察手记</span><span>${String(step+1).padStart(2,'0')} / 25</span></div><div class="bar"><div class="fill" style="width:${step/25*100}%"></div></div><div class="eyebrow">第 ${step+1} 题</div><h2>${q[0]}</h2>${q[1].map((o,i)=>`<button class="option" onclick="choose(${i})">${String.fromCharCode(65+i)}. ${o}</button>`).join('')}<button class="back" onclick="step--;render()">← ${step===0?'返回首页':'上一题'}</button></div>`;return}let s=Object.fromEntries(keys.map(k=>[k,0]));answers.forEach((a,i)=>s[weights[i][a]]++);let winner=keys.reduce((best,k)=>s[k]>s[best]?k:best,keys[0]);let t=types[winner];app.innerHTML=`<div class="card result"><div class="eyebrow">你的关系观察报告 · 01 / 01</div><h1>${t.name}</h1><div class="quote">“${t.quote}”</div><div class="section"><h3>在关系里，你可能会</h3><p>${t.show}</p></div><div class="section"><h3>这种习惯从哪里来</h3><p>${t.why}</p></div><div class="section"><h3>为什么匹配到它</h3><p>在 25 次选择里，与你最接近的“${t.name}”线索出现了 ${s[winner]} 次。它只是此刻的一面镜子，不是给你的定义。</p></div><div class="section"><h3>藏在背后的优势</h3><p>${t.gift}</p></div><div class="section"><h3>可以试试的小调整</h3><ol>${t.tips.map(x=>`<li>${x}</li>`).join('')}</ol></div><div class="section"><h3>彩蛋 · 把一次真实相处改写成小剧场</h3><p class="small">想起你最近一次类似的相处，把下面台词里的情境和称呼换成自己的真实经历。</p><div class="theater">${t.scene}</div></div><p class="small">趣味自省 · 非心理诊断 · 愿你温柔地看见自己</p><div class="actions"><button class="primary" onclick="step=-1;answers=[];render()">重新测试</button><button class="secondary" onclick="window.print()">保存 / 打印结果</button></div></div>`}function choose(i){answers[step]=i;step++;render();scrollTo({top:0,behavior:'smooth'})}render();
</script></body></html>
